# local 프로필: http 개발 환경이라 쿠키 접두사(__Host-/__Secure-)와 Secure를 끈다
app.cookie.host-prefix=false
app.cookie.secure=false

# U7: API 문서는 local에서만 노출
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# 카카오 로그인 설정이 없어도 다른 도메인 개발은 기동할 수 있도록 자리표시 값을 둔다(로그인은 실제 값을 환경 변수로 줘야 동작)
app.auth.kakao-client-id=${KAKAO_CLIENT_ID:not-configured}
app.auth.kakao-redirect-uri=${KAKAO_REDIRECT_URI:http://localhost:8080/api/v1/auth/kakao/callback}
app.auth.complete-url=${APP_AUTH_COMPLETE_URL:http://localhost:5173/auth/complete}

# 사진 저장소 설정이 없어도 다른 도메인 개발은 기동할 수 있도록 자리표시 값을 둔다(사진 업로드는 실제 값을 환경 변수로 줘야 동작)
app.storage.endpoint=${R2_ENDPOINT:http://localhost:9000}
app.storage.bucket=${R2_BUCKET:not-configured}
app.storage.access-key-id=${R2_ACCESS_KEY_ID:not-configured}
app.storage.access-key-value=${R2_SECRET_ACCESS_KEY:not-configured}
app.storage.public-base-url=${R2_PUBLIC_BASE_URL:http://localhost:9000/not-configured}
