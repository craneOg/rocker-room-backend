# local 프로필: http 개발 환경이라 쿠키 접두사(__Host-/__Secure-)와 Secure를 끈다
app.cookie.host-prefix=false
app.cookie.secure=false

# U7: API 문서는 local에서만 노출
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# 카카오 로그인 설정이 없어도 다른 도메인 개발은 기동할 수 있도록 자리표시 값을 둔다(로그인은 실제 값을 환경 변수로 줘야 동작)
app.auth.kakao-client-id=${KAKAO_CLIENT_ID:not-configured}
app.auth.kakao-redirect-uri=${KAKAO_REDIRECT_URI:http://localhost:8080/api/v1/auth/kakao/callback}
