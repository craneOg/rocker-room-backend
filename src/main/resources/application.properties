spring.application.name=band-web-backend
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# 키를 직접 지정하는 행(available_slot 등) INSERT를 묶어서 전송. MySQL은 JDBC URL에 rewriteBatchedStatements=true가 있어야 한 문장으로 합쳐짐
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true

# 기본 생성 비밀번호(UserDetailsService) 비활성: 비밀번호 로그인을 쓰지 않는다
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# 보안(0.5): 값은 환경 변수로만 주입한다. JWT_SECRET이 없거나 32바이트 미만이면 기동 실패
app.jwt.secret=${JWT_SECRET:}
app.jwt.access-ttl=PT15M
app.cors.origin=${APP_CORS_ORIGIN:http://localhost:5173}
app.cookie.host-prefix=true
app.cookie.secure=true

# U7: API 문서는 운영·스테이징에서 비노출. local 프로필에서만 켠다
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
