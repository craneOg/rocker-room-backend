# 테스트 전용 값. 운영 값이 아니며 어디에도 재사용하지 않는다
app.jwt.secret=test-only-signing-key-0123456789-abcdef-not-for-production
app.cors.origin=http://localhost:5173
app.auth.kakao-client-id=test-client-id
app.auth.kakao-client-secret=test-client-secret
app.auth.kakao-redirect-uri=http://localhost:8080/api/v1/auth/kakao/callback
app.auth.complete-url=http://localhost:5173/auth/complete

# 정리 배치 스케줄러(테스트에서는 끈다)
app.scheduling.enabled=false

# 로그인 전 초대 미리보기 IP별 요청 제한(테스트에서 한도를 낮춘다)
app.rate-limit.invitation-preview.limit=5
app.rate-limit.invitation-preview.window=PT1M
